# The gate that a workflow does not hide a failed test: `|| true`, a pipe with no pipefail, or continue-on-error.
# A branch with no pull request starts it by workflow_dispatch.
name: Workflow gate

on:
  # Each pull request starts this workflow. The job changes skips the work when no workflow changes.
  pull_request:
  workflow_dispatch:

permissions: {}

# One run for each branch: a newer run stops the older one.
concurrency:
  group: workflow-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@e077054e0f2ebb8441e4bc525b56cf2acc2afb6f # main
        with:
          paths: |
            .github/workflows/**
            scripts/workflow-gate.ts
            packages/testkit/src/workflow-faults.ts

  workflows:
    needs: changes
    if: needs.changes.outputs.match == 'true' || github.event_name == 'workflow_dispatch'
    name: No hidden failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/workflow-gate.ts
