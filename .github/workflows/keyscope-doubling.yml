# Throwaway measure of a draft pull request: compile time, bytes and memory of doubling programs, with shared objects and with names (third run).
name: keyscope doubling
on:
  push:
    branches: [keyscope]
    paths: [.github/workflows/keyscope-doubling.yml]
permissions: {}
jobs:
  doubling:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The branch, with the limit
        run: |
          cp tools/keyscope/doubling-child.mjs packages/pilots/scripts/doubling-child.mjs
          node tools/keyscope/doubling.mjs limit packages/pilots/scripts/doubling-child.mjs plain,constant,loop,let 10,14,15,20,30,40
      - name: The branch, without the limit
        run: |
          sed -i 's/MAX_PLACES = 1 << 16/MAX_PLACES = 2 ** 60/' packages/compiler/src/unshared.ts
          node tools/keyscope/doubling.mjs nolimit packages/pilots/scripts/doubling-child.mjs plain,constant,loop 8,10,12,14,16,18,20
          node tools/keyscope/doubling.mjs nolimit packages/pilots/scripts/doubling-child.mjs let 10,20,30,40
      - name: Main
        run: |
          git checkout 3a0019f -- packages/compiler/src
          node tools/keyscope/doubling.mjs main packages/pilots/scripts/doubling-child.mjs plain,constant,loop 8,10,12,14,16,18,20
          node tools/keyscope/doubling.mjs main packages/pilots/scripts/doubling-child.mjs let 10,20,30,40
