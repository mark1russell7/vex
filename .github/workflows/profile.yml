# The CPU profile of one case of the speed gate of the compiler (packages/compiler/bench/profile.ts). Timing runs in
# CI, not on a shared machine. The summary gives the time of each arm and its top functions, and the artifact keeps
# each .cpuprofile for a viewer. With the input alloc, the workflow gives the allocations of the case in place of the
# CPU profile (packages/compiler/bench/alloc.ts): bytes and objects for each node of each arm, with no limit. These
# counts do not depend on the load of the machine. The artifact keeps the JSON record of each process.
name: Profile

on:
  workflow_dispatch:
    inputs:
      case:
        description: The case of the compiler gate, from 0 (3 is the nested radial ring of 60 children)
        type: string
        default: "3"
      processes:
        description: The number of fresh processes, each with its own profile
        type: string
        default: "3"
      arms:
        description: The entry function of each arm, separated by commas
        type: string
        default: radial,radialArrange
      groups:
        description: The groups of functions, as name=f1,f2;name=f3, with a function name or a full key (name file:line)
        type: string
        default: "search=fn58,fn54,op_0_12,(anonymous) (eval):193,(anonymous) (eval):180;pair=fn115,fn109,fn89,fn7,(anonymous) (eval):232;helpers=k_number,G,L,Q,T,F"
      node_flags:
        description: More flags of Node.js for each process, for example --no-turbo-inlining
        type: string
        default: ""
      alloc:
        description: With true, the job measures the allocations of the case (4 is the tree), and no CPU profile
        type: boolean
        default: false
      module:
        description: With a module of ireko, the job profiles its print on the base of the module cost gate and on this ref, and no case
        type: string
        default: ""

permissions: {}

concurrency:
  group: profile-${{ github.ref }}-${{ inputs.case }}-${{ inputs.node_flags }}-${{ inputs.alloc }}-${{ inputs.module }}
  cancel-in-progress: false

jobs:
  profile:
    if: ${{ !inputs.alloc && inputs.module == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile
      - env:
          GATE_CASE: ${{ inputs.case }}
          PROFILE_PROCESSES: ${{ inputs.processes }}
          PROFILE_ARMS: ${{ inputs.arms }}
          PROFILE_GROUPS: ${{ inputs.groups }}
          PROFILE_NODE_FLAGS: ${{ inputs.node_flags }}
          PROFILE_DIR: ${{ runner.temp }}/profiles
        run: node packages/compiler/bench/profile.ts | tee profile.txt
      - if: ${{ !cancelled() }}
        env:
          GATE_CASE: ${{ inputs.case }}
        run: |
          {
            echo "### CPU profile of case $GATE_CASE"
            echo
            echo '```'
            cat profile.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-case-${{ inputs.case }}
          path: ${{ runner.temp }}/profiles
          retention-days: 14

  module:
    if: ${{ inputs.module != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      BASE: 8ae233be3bd54744ae558020e5584975b4dfefee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The base
        run: |
          git worktree add -q ../base "$BASE"
          cd ../base
          pnpm install --frozen-lockfile --filter @vex/pilots...
      - env:
          MODULE: ${{ inputs.module }}
          PROCESSES: ${{ inputs.processes }}
          PROFILE_DIR: ${{ runner.temp }}/profiles
        run: node packages/pilots/bench/module-profile.ts "$(dirname "$PWD")/base" "$MODULE" "$PROCESSES" "$PROFILE_DIR" | tee profile.txt
      - if: ${{ !cancelled() }}
        env:
          MODULE: ${{ inputs.module }}
        run: |
          {
            echo "### CPU profile of the print of $MODULE"
            echo
            echo '```'
            cat profile.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  alloc:
    if: ${{ inputs.alloc }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile
      - env:
          GATE_CASE: ${{ inputs.case }}
          ALLOC_PROCESSES: ${{ inputs.processes }}
          ALLOC_NODE_FLAGS: ${{ inputs.node_flags }}
          ALLOC_DIR: ${{ runner.temp }}/alloc
        run: node packages/compiler/bench/alloc.ts | tee "$RUNNER_TEMP/alloc.txt"
      - if: ${{ !cancelled() }}
        env:
          GATE_CASE: ${{ inputs.case }}
        run: |
          {
            echo "### Allocations of case $GATE_CASE"
            echo
            echo '```'
            cat "$RUNNER_TEMP/alloc.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/alloc.txt" "$RUNNER_TEMP/alloc/summary.txt"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alloc-case-${{ inputs.case }}
          path: ${{ runner.temp }}/alloc
          retention-days: 14
