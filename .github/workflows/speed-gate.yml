# Throwaway measure on a side branch of the branch value-fixes, not for main: the cost of those commits alone against the base
# of the module cost gate, and the bytes of the 16 modules. The limits of the bench are of another tree, so a row over its limit
# is only a row here. A job fails when a row is missing. The tree of packages/compiler/src is the tree of value-fixes.
name: Speed gate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: value-fixes-cost
  cancel-in-progress: false

jobs:
  reads:
    name: Module cost ${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rep: [1, 2, 3, 4, 5]
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      BASE: 8ae233be3bd54744ae558020e5584975b4dfefee
      FIXES: 4dbb237b042dcee8509f789a78c5c9d9ff27b2ed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - name: The same tree as value-fixes
        run: |
          echo "TREE side $(git rev-parse HEAD) $(git rev-parse HEAD:packages/compiler/src)"
          echo "TREE fixes $FIXES $(git rev-parse "$FIXES:packages/compiler/src")"
          test "$(git rev-parse HEAD:packages/compiler/src)" = "$(git rev-parse "$FIXES:packages/compiler/src")"
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The base
        run: |
          git worktree add -q ../base "$BASE"
          cp packages/pilots/bench/module-cost-child.ts ../base/packages/pilots/bench/
          cd ../base
          pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The read
        env:
          REP: ${{ matrix.rep }}
        run: |
          if pnpm --filter @vex/pilots run module-cost "$(dirname "$PWD")/base" --turn "$((REP - 1))" | tee module-cost.txt; then state=under; else state=over; fi
          echo "LIMITS of another tree: $state"
      - name: Each row is there
        run: |
          rows="$(grep -cE '^(ok|FAIL|undecided) module' module-cost.txt)"
          echo "ROWS $rows"
          test "$rows" = 18
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: read-${{ matrix.rep }}
          path: module-cost.txt
          retention-days: 30

  bytes:
    name: Bytes of the 16 modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      BASE: 8ae233be3bd54744ae558020e5584975b4dfefee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The base
        run: |
          git worktree add -q ../base "$BASE"
          cp packages/pilots/bench/module-hash.ts ../base/packages/pilots/bench/
          cd ../base
          pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The compare
        run: |
          node packages/pilots/bench/module-hash.ts > fixes.txt
          (cd ../base && node packages/pilots/bench/module-hash.ts) > base.txt
          sed 's/^/FIXES /' fixes.txt
          sed 's/^/BASE /' base.txt
          echo "LINES $(wc -l < fixes.txt) $(wc -l < base.txt)"
          test "$(wc -l < fixes.txt)" = 32
          if diff base.txt fixes.txt; then echo "BYTES equal"; else echo "BYTES differ"; fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bytes
          path: |
            fixes.txt
            base.txt
          retention-days: 30
