# Throwaway measure of a draft pull request: the bytes of the sixteen ireko modules on each printer, and the two forms of V-082.
name: keyscope bytes
on:
  push:
    branches: [keyscope-cost]
    paths: [.github/workflows/keyscope-bytes.yml]
permissions: {}
concurrency:
  group: keyscope-bytes
  cancel-in-progress: true
jobs:
  bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Both tree hashes
        run: |
          echo "TREE side $(git rev-parse HEAD) $(git rev-parse HEAD:packages/compiler/src)"
          echo "TREE keyscope $(git rev-parse origin/keyscope) $(git rev-parse origin/keyscope:packages/compiler/src)"
          echo "TREE runname $(git rev-parse origin/runname) $(git rev-parse origin/runname:packages/compiler/src)"
          test "$(git rev-parse HEAD:packages/compiler/src)" = "$(git rev-parse origin/keyscope:packages/compiler/src)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mark1russell7/ireko
          path: ireko-main
          persist-credentials: false
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: Measure
        working-directory: packages/pilots
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cp ../../tools/keyscope/bytes.test.ts.txt src/zz-bytes.test.ts
          cp ../../tools/keyscope/places.test.ts.txt src/zz-places.test.ts
          measure() { BYTES_LABEL=$1 pnpm exec vitest run src/zz-bytes.test.ts --maxWorkers=1 2>&1 | grep -E "BYTES|FAIL|Tests " || true; }
          pnpm exec vitest run src/zz-places.test.ts --maxWorkers=1 2>&1 | grep -E "PLACES|FAIL" || true
          measure branch
          echo "COMMITTED start"
          node scripts/module-bytes.ts ../../ireko-main 2>&1 | tail -30 && echo "COMMITTED equal" || echo "COMMITTED differ"
          git checkout origin/runname -- ../compiler/src ../compiler/test
          measure runname-conditional
          node ../../tools/keyscope/alias-each.mjs ../compiler/src/module.ts
          measure runname-alias
          git checkout "$(git merge-base HEAD origin/main)" -- ../compiler/src
          measure base
          git checkout 3a0019f -- ../compiler/src
          measure old
          git checkout ead65a70bde9f31b9fef4a8cc35cb69289167298 -- ../compiler/src
          measure pin
          git checkout "@mark1russell7/vex-compiler@0.17.2" -- ../compiler/src
          measure npm
