# A run of this branch only: the old and the new hand arm of the schema bench, on one runner.
name: Speed gate

on:
  workflow_dispatch:

permissions: {}

jobs:
  arms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: |
          git show 912d347:packages/pilots/bench/schema-speed.ts \
            | sed -n '/^interface Row/,/^\/\/ The input of the speed case/p' | sed '$d' \
            | sed 's/^function inferSchema/export function schemaReference/' > packages/pilots/bench/old-arm.ts
          grep -c schemaReference packages/pilots/bench/old-arm.ts
      - run: node packages/pilots/bench/schema-arms.ts
