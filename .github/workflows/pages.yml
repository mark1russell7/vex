# Builds packages/site and publishes it to GitHub Pages at https://mark1russell7.github.io/vex/, with
# the shared Pages workflow of mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
# A scheduled build takes the newest commit of main, or the newest green one if CI failed on it.
# A pull request builds and checks the site in a browser, with no deploy.
name: Pages

on:
  push:
    branches: [main]
  # After a release, so that the Releases page has the new version
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  pull_request:
  # Every 3 hours, so that the Status page shows the open pull requests and issues of now
  schedule:
    - cron: "53 */3 * * *"
  workflow_dispatch:

permissions: {}

# One deployment at a time. A newer push cancels a deployment that waits.
# Each pull request has its own group, and a newer push cancels its run.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@2cc4e3c80458e3f1650e10b8b097522afa34dbe1 # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      # green-main reads the Actions runs. site-pages reads the pull requests, the issues and their checks.
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      # The test report (the living spec page shows the status of the tests of each requirement), then the site
      github-token: true
      build: |
        pnpm --filter @vex/site run report
        pnpm --filter @vex/site run build
      out: packages/site/dist
      env: '{"SITE_BASE": "/${{ github.event.repository.name }}", "ASTRO_TELEMETRY_DISABLED": "1"}'
      # The Releases page and the Status page (releases/, status/ and their data/*.json), at deploy time
      group: "@mark1russell7/vex"
      packages: "@mark1russell7/vex,@mark1russell7/vex-domains,@mark1russell7/vex-testkit,@mark1russell7/vex-compiler,@mark1russell7/vex-mcp"
      site-name: Vex
      deploy: ${{ github.event_name != 'pull_request' }}
      # The site check opens these pages in a browser before the deploy. Its probe drives the first page.
      site-check: true
      site-check-pages: /app/,/,/releases/,/status/
      site-check-probe: packages/site/src/check-probe.ts
      # The open items for the Status page. check:conventions parses the file on each pull request (roadmap-parses).
      roadmap: docs/ROADMAP.md
