packages:
  - "packages/*"
  # The mutation lane (Stryker with Vitest 4.1)
  - "tools/*"

# Packages allowed to run install scripts. Since pnpm 11 every other package that has one fails the install.
# A git-hosted package is approved by its repository URL, so a new commit of cue needs no new approval.
allowBuilds:
  "@mark1russell7/cue@git+https://github.com/mark1russell7/cue.git": true
  esbuild: true

minimumReleaseAgeExclude:
  # coeval is our own package, and it has provenance. Its patches come often, so the name stays here, not each version.
  # Renovate keeps its own wait of 1 day for the packages of @mark1russell7.
  - "@mark1russell7/coeval"
  - "@astrojs/starlight@0.42.6"
  - astro@7.3.8
  - "@mark1russell7/algebra@0.7.2"
  - "@mark1russell7/service@0.5.5"
  - "@procedures/client@0.14.1"
  - "@procedures/mcp-server@0.14.1"
  - "@procedures/mcp@0.14.1"
