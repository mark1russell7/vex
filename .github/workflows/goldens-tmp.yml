name: goldens-tmp

on:
  push:
    branches: [appendown]

permissions: {}

jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mark1russell7/vex-compiler run typecheck > typecheck.log 2>&1; cat typecheck.log
        continue-on-error: true
      - run: pnpm exec oxlint packages/compiler/src > lint.log 2>&1; cat lint.log
        continue-on-error: true
      - run: pnpm --filter @mark1russell7/vex-compiler exec vitest run -u > test-u.log 2>&1; cat test-u.log
        continue-on-error: true
      - run: pnpm --filter @mark1russell7/vex-compiler exec vitest run > test.log 2>&1; cat test.log
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens
          path: |
            packages/compiler/src/__golden__
            *.log
