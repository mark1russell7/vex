# The security scans of this repository: dependency review, osv-scanner and CodeQL (CI.md of
# mark1russell7/template). A pull request fails only for a new finding at or above high. Pushes to
# main and the weekly scan upload the findings to the Security tab.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: mark1russell7/template/.github/workflows/reusable-security.yml@0b0f1a790211d13e7f7ebd7342a47e97239db2d8 # main
    permissions:
      contents: read
      security-events: write
      actions: read

  # The one check of this file that the ruleset of main names, next to CI OK (CI.md of mark1russell7/template,
  # "The check of the ruleset"). The scans stay out of ci.yml, because release.yml calls ci.yml with contents: read only.
  security-ok:
    name: Security OK
    if: always()
    needs: [security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each scan passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
