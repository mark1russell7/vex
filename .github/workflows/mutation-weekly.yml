name: Mutation weekly

# The full read of the mutation lane and its gate (LANE.GATE, tools/mutation/README.md). This workflow has its own file, so a
# red run stays on the row of the role vex until the next full run: a green Nightly on Sunday does not clear it.
on:
  schedule:
    # Each scheduled heavy run of the fleet has its own minute (docs/STRATEGY.md of the fleet, 2026-10-30).
    - cron: "54 6 * * 6"
  workflow_dispatch:
    inputs:
      timeout_ms:
        description: The added clock limit of one mutant in milliseconds. Empty keeps the default of the lane.
        default: ""

permissions: {}

concurrency:
  group: mutation-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lane-plan:
    name: mutation plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/workflow-gate.ts
      - id: plan
        run: node tools/mutation/plan.ts --full

  mutation:
    name: mutation (${{ matrix.part }})
    needs: lane-plan
    runs-on: ubuntu-latest
    # Each job has one part of the lane (tools/mutation/layout.ts).
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # All parts of the run are this one matrix, so the run holds at most 3 slots of the heavy work.
      max-parallel: 3
      matrix:
        part: ${{ fromJSON(needs.lane-plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - uses: ./.github/actions/mutation-part
        with:
          part: ${{ matrix.part }}
          timeout-ms: ${{ inputs.timeout_ms }}
          # 10 minutes under the limit of the job, for the upload of the costs (LANE.COST).
          stop-minutes: 140

  lane-read:
    name: The gate of the lane
    needs: mutation
    # A cancelled part gives no report, and the gate reads that as no read. So this job also starts after a failed part.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # This job reads the artifact `lane-tests` of the last full run on main.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/workflow-gate.ts
      # Rule 8i: this job shows in its log that the gate can fail, before it reads the run.
      - name: The flip of the gate
        run: node tools/mutation/lane-read.ts --flip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-report-*
          path: reports/parts
      # The newest run that holds this artifact can have a red gate: a part that fell keeps its old count in that file (LANE.TESTS).
      - name: The last read of the tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run=$(gh api "repos/$REPO/actions/artifacts?name=lane-tests&per_page=30" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -n "$run" ]; then gh run download "$run" -R "$REPO" -n lane-tests -D reports/last-tests; else echo "No earlier read of the tests."; fi
      - name: The gate
        run: node tools/mutation/lane-read.ts --gate reports/parts --last reports/last-tests/lane-tests.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-read
          path: reports/lane-read.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lane-tests
          path: reports/lane-tests.json
          if-no-files-found: ignore
