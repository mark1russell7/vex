# Throwaway measure of a draft pull request: where the compile time of a program with no shared object goes, and the compile of the modules of ireko.
# Tree 4e3c1af.
name: keyscope attrib
on:
  push:
    branches: [keyscope-cost]
    paths: [.github/workflows/keyscope-attrib.yml, tools/keyscope/attrib.mjs, tools/keyscope/ireko-child.mjs, tools/keyscope/cost-child.mjs]
permissions: {}
concurrency:
  group: keyscope-attrib
  cancel-in-progress: true
jobs:
  attrib:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - name: Both tree hashes
        run: |
          echo "TREE side $(git rev-parse HEAD) $(git rev-parse HEAD:packages/compiler/src)"
          echo "TREE keyscope $(git rev-parse origin/keyscope) $(git rev-parse origin/keyscope:packages/compiler/src)"
          test "$(git rev-parse HEAD:packages/compiler/src)" = "$(git rev-parse origin/keyscope:packages/compiler/src)"
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The base
        run: |
          base=$(git merge-base HEAD origin/main)
          echo "BASE $base"
          git worktree add -q ../base "$base"
          cd ../base
          pnpm install --frozen-lockfile --filter @vex/pilots...
          cp "$GITHUB_WORKSPACE/tools/keyscope/cost-child.mjs" "$GITHUB_WORKSPACE/tools/keyscope/ireko-child.mjs" packages/pilots/scripts/
      - name: Measure
        run: |
          sed -i 's/MAX_PLACES: number = .*/MAX_PLACES: number = 2 ** 60;/' packages/compiler/src/unshared.ts
          grep -q 'MAX_PLACES: number = 2 \*\* 60;' packages/compiler/src/unshared.ts
          cp tools/keyscope/cost-child.mjs tools/keyscope/ireko-child.mjs packages/pilots/scripts/
          node tools/keyscope/attrib.mjs "$PWD" "$(dirname "$PWD")/base"
