# The gates of the committed modules (COMPILE.MODULE.BYTES). A repository that commits a printed module calls this
# workflow in two ways. A pull request gives `vex-ref`, a commit of vex: the print of that commit must equal the files,
# and the result depends only on the pull request. A daily run gives `latest`: the print of the last release must equal
# the files, so the run fails only when a release changes the output.
name: Module bytes

on:
  workflow_call:
    inputs:
      vex-ref:
        description: The commit of vex that printed the committed modules, or the word latest for the last release.
        required: true
        type: string

permissions: {}

jobs:
  bytes:
    name: Module bytes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Find the commit of vex
        id: ref
        env:
          VEX_REF: ${{ inputs.vex-ref }}
        run: |
          if [ "$VEX_REF" = latest ]; then
            echo "ref=@mark1russell7/vex-compiler@$(npm view @mark1russell7/vex-compiler version)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$VEX_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mark1russell7/vex
          ref: ${{ steps.ref.outputs.ref }}
          path: vex
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: vex/package.json
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
        working-directory: vex
      - name: Compare the bytes
        working-directory: vex
        run: node packages/pilots/scripts/module-bytes.ts ../caller
