name: Weekly

# The long run of phase D (docs/QUALITY-PLAN.md §8): one million runs of each property, each week. Each package has
# its own job, so a slow package does not stop the others. The setup prints the seed. To repeat a failure, set FC_SEED.
on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  properties:
    name: properties (1000000 runs) ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ["@mark1russell7/vex-testkit", "@vex/pilots", "@vex/formula", "@vex/sheet-app", "@vex/site"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ matrix.package }}" run test
        env:
          FC_NUM_RUNS: "1000000"
