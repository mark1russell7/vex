# A read branch: a paired read of the time of a print of each module for V-093, with its base in the same job. This file does not merge.
name: Gate flip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair:
    name: Pair ${{ matrix.name }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { name: import, rep: 1, tree: 95f067e8246a2ec6fb3dbb1e1223e62318ec1666, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: import, rep: 2, tree: 95f067e8246a2ec6fb3dbb1e1223e62318ec1666, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: import, rep: 3, tree: 95f067e8246a2ec6fb3dbb1e1223e62318ec1666, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: comment, rep: 1, tree: 5eee80e50bb604c0efae7ec8e172b57b37f6c4d6, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: comment, rep: 2, tree: 5eee80e50bb604c0efae7ec8e172b57b37f6c4d6, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: comment, rep: 3, tree: 5eee80e50bb604c0efae7ec8e172b57b37f6c4d6, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: bare, rep: 1, tree: ec8afb9700eefd04407b524f5bc2a75c5fb78b2d, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: bare, rep: 2, tree: ec8afb9700eefd04407b524f5bc2a75c5fb78b2d, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: bare, rep: 3, tree: ec8afb9700eefd04407b524f5bc2a75c5fb78b2d, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: late, rep: 1, tree: 38d24b499e6bc730aa6304d00870ec985121ac29, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: late, rep: 2, tree: 38d24b499e6bc730aa6304d00870ec985121ac29, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: late, rep: 3, tree: 38d24b499e6bc730aa6304d00870ec985121ac29, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      BASE: ${{ matrix.base }}
      REP: ${{ matrix.rep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ matrix.tree }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The base
        run: |
          git worktree add -q ../base "$BASE"
          cp packages/pilots/bench/module-cost-child.ts ../base/packages/pilots/bench/
          cd ../base
          pnpm install --frozen-lockfile --filter @vex/pilots...
      - run: pnpm --filter @vex/pilots run module-cost "$(dirname "$PWD")/base" --turn "$((REP - 1))"
