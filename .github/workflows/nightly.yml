name: Nightly

# The slow checks (docs/REVIEW.md §8.2 and §9.1): 10000 runs of each property, the mutation lane, the speed lane,
# the next TypeScript and the links of the docs. Each job keeps its report as an artifact.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: The packages of the mutation lane, as a JSON list
        default: '["core.kernel", "core.base", "domains", "testkit", "compiler"]'

permissions: {}

# A run for some packages does not stop a run for other packages, and a run on a branch does not stop a run on
# another branch. A new run on the same branch for the same packages stops the old run.
concurrency:
  group: nightly-${{ github.ref }}-${{ inputs.packages || 'all' }}
  cancel-in-progress: true

jobs:
  properties:
    name: properties (10000 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The setup prints the seed. To repeat a failure, set FC_SEED to that seed.
      - run: pnpm --filter @mark1russell7/vex-testkit --filter @mark1russell7/vex-compiler --filter @vex/pilots --filter @vex/formula --filter @vex/sheet-app --filter @vex/site run test
        env:
          FC_NUM_RUNS: "10000"

  mutation:
    name: mutation (${{ matrix.package }})
    runs-on: ubuntu-latest
    # The lane mutates the four published packages, one package or one part of the core on each runner
    # (tools/mutation/stryker.config.mjs).
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages || '["core.kernel", "core.base", "domains", "testkit", "compiler"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stryker with Vitest 4.1, in tools/mutation, until Stryker supports Vitest 5
      - run: pnpm --filter @vex/mutation run mutation
        env:
          VEX_MUTATE: ${{ matrix.package }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-${{ matrix.package }}
          path: reports/mutation/
          if-no-files-found: ignore

  bench:
    name: speed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The shell bash sets pipefail, so a gate that fails fails its step, also with its output piped into tee.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p reports && pnpm --filter @mark1russell7/vex run bench | tee reports/bench.txt
      # The gate fails when Vex is much slower than the hand-written loops (bench/gate.ts gives the limits).
      - run: pnpm --filter @mark1russell7/vex run bench:gate | tee -a reports/bench.txt
      # The gate of the compiler: generated code against the same loops, with no fallback (docs/COMPILER.md §10). It runs
      # also when the first gate fails, and the report keeps the lines of both.
      - if: ${{ !cancelled() }}
        run: pnpm --filter @mark1russell7/vex-compiler run bench:gate | tee -a reports/bench.txt
      # The schema pilot of Graph in the interpreter (EXAMPLE.SCHEMA): the target is 5 ms for one sample. The step fails
      # only when a result is not the result of Graph. The time does not make it fail.
      - if: ${{ !cancelled() }}
        run: BENCH_OUT=reports/schema-speed.json node packages/pilots/bench/schema-speed.ts | tee -a reports/bench.txt
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: |
            reports/bench.txt
            reports/schema-speed.json

  typescript-next:
    name: typescript@next
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A failure here is an early warning, not a defect of Vex.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck with the next TypeScript
        run: |
          for p in core domains testkit compiler; do
            for c in tsconfig.json tsconfig.test.json; do
              pnpm dlx --package=typescript@next tsc -p "packages/$p/$c" --noEmit
            done
          done

  links:
    name: links of the docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the web links: the relative links of the site pages resolve at build time.
      # The journal LMCS does not answer the runners of GitHub: two nights of timeouts, but 200 from a local check.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --scheme https --scheme http --max-retries 2 --timeout 30 --accept "200..=299,403,429"
            --exclude "^https://lmcs\.episciences\.org/"
            README.md "spec/**/*.md" "docs/*.md" "packages/*/README.md" "packages/site/src/content/**/*.mdx"
          fail: true
