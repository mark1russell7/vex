name: Nightly

# The slow checks (docs/REVIEW.md §8.2 and §9.1): 10000 runs of each property, the mutation lane on the changed files, the
# speed lane, the next TypeScript and the links of the docs. Each job keeps its report as an artifact. The mutation jobs of
# this workflow are report only by design: mutation-weekly.yml reads each file and holds the gate (LANE.DELAY).
on:
  schedule:
    # Each scheduled heavy run of the fleet has its own minute (docs/STRATEGY.md of the fleet, 2026-10-30).
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: The parts of the mutation lane, as a JSON list. Empty reads the files that changed in the last 25 hours.
        default: ""
      timeout_ms:
        description: The added clock limit of one mutant in milliseconds. Empty keeps the default of the lane.
        default: ""

permissions: {}

# The runner slots of the account are a budget: one run for each branch. A new run on the same branch stops the old
# run, and a run on a branch does not stop a run on another branch.
# The event name is in the key: a dispatch with other inputs never cancels or holds a scheduled run (fleet rule of 2026-11-02).
concurrency:
  group: nightly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Each package has its own job, so the slowest package alone sets the time of a job. On 2026-11-09 one job for all
  # six packages stopped at its limit of 30 minutes.
  properties:
    name: properties (10000 runs, ${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        package:
          - "@mark1russell7/vex-testkit"
          - "@mark1russell7/vex-compiler"
          - "@vex/pilots"
          - "@vex/formula"
          - "@vex/sheet-app"
          - "@vex/site"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile
      # The setup prints the seed. To repeat a failure, set FC_SEED to that seed.
      - run: pnpm --filter "$PACKAGE" run test
        env:
          FC_NUM_RUNS: "10000"
          PACKAGE: ${{ matrix.package }}

  # The check of the lane that a test file loads can fail: an added fault turns it red, and a clean copy in the same
  # job stays green.
  mutation-load:
    name: mutation load check flip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile
      - run: node prepare.mjs && node load-check.ts --flip
        working-directory: tools/mutation

  lane-plan:
    name: mutation plan
    # The lane starts after the other jobs, so the workflow holds at most 3 runner slots (max-parallel below).
    needs: [properties, bench, typescript-next, links]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The plan reads the commits of the last 25 hours.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node scripts/workflow-gate.ts
      - id: plan
        run: node tools/mutation/plan.ts
        env:
          VEX_PARTS: ${{ inputs.packages }}

  mutation:
    name: mutation (${{ matrix.package }})
    needs: lane-plan
    if: ${{ !cancelled() && needs.lane-plan.outputs.parts != '[]' && needs.lane-plan.outputs.parts != '' }}
    runs-on: ubuntu-latest
    # Each job has one part of the lane (tools/mutation/layout.ts).
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # At most 3 jobs of the matrix at one time, so the gates and the releases of the fleet keep their slots.
      max-parallel: 3
      matrix:
        package: ${{ fromJSON(needs.lane-plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - uses: ./.github/actions/mutation-part
        with:
          part: ${{ matrix.package }}
          changed: ${{ needs.lane-plan.outputs.changed }}
          timeout-ms: ${{ inputs.timeout_ms }}
          # 10 minutes under the limit of the job, for the upload of the costs (LANE.COST).
          stop-minutes: 140

  bench:
    name: speed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The shell bash sets pipefail, so a gate that fails fails its step, also with its output piped into tee.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile
      # Each record of the report names the CPU of the runner and the mode (packages/core/bench/measure.ts).
      - run: mkdir -p reports && node --input-type=module -e 'import { envLine } from "./packages/core/bench/measure.ts"; console.info(envLine("process"));' | tee reports/bench.txt
      # The times of the vitest bench are absolute times for this runner, and the report claims no ratio from them.
      - run: pnpm --filter @mark1russell7/vex run bench | tee -a reports/bench.txt
      # The gate fails when Vex is much slower than the hand-written loops (bench/gate.ts gives the limits).
      - run: pnpm --filter @mark1russell7/vex run bench:gate | tee -a reports/bench.txt
      # The gate of the compiler: generated code against the same loops, with no fallback (docs/COMPILER.md §10). It runs
      # also when the first gate fails, and the report keeps the lines of both.
      - if: ${{ !cancelled() }}
        run: pnpm --filter @mark1russell7/vex-compiler run bench:gate | tee -a reports/bench.txt
      # The schema pilot in the interpreter (EXAMPLE.SCHEMA): the target is 5 ms for one sample. The step fails
      # only when a result is not the result of the reference. The time does not make it fail.
      - if: ${{ !cancelled() }}
        run: COLD=1 BENCH_OUT=reports/schema-speed.json node packages/pilots/bench/schema-speed.ts | tee -a reports/bench.txt
      - if: ${{ !cancelled() }}
        run: BENCH_OUT=reports/schema-cold.json node packages/pilots/bench/schema-cold.ts | tee -a reports/bench.txt
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: |
            reports/bench.txt
            reports/schema-speed.json
            reports/schema-cold.json

  typescript-next:
    name: typescript@next
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A failure here is an early warning, not a defect of Vex.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile
      - name: Typecheck with the next TypeScript
        run: |
          for p in core domains testkit compiler; do
            for c in tsconfig.json tsconfig.test.json; do
              pnpm dlx --package=typescript@next tsc -p "packages/$p/$c" --noEmit
            done
          done

  links:
    name: links of the docs
    # The workflow holds at most 3 runner slots: properties, speed and typescript@next run first, then this job, then
    # the mutation lane. A job of the order starts also when a job before it failed.
    needs: typescript-next
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the web links: the relative links of the site pages resolve at build time.
      # The journal LMCS does not answer the runners of GitHub: two nights of timeouts, but 200 from a local check.
      # Each link that fails gets 4 more tries, with a longer wait before each try (lychee doubles the wait).
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --scheme https --scheme http --max-retries 4 --retry-wait-time 5 --timeout 30
            --accept "200..=299,403,429" --exclude "^https://lmcs\.episciences\.org/"
            README.md "spec/**/*.md" "docs/*.md" "packages/*/README.md" "packages/site/src/content/**/*.mdx"
          output: lychee/out.md
          fail: false
      # A broken link (an answer that is not in --accept) always fails the job. A host that does not answer is a
      # timeout: it fails the scheduled run, and it is a warning on a run that a person starts for a branch. Thus a
      # slow outside service (shields.io on 2026-10-30) does not make the evidence run of a pull request red.
      - name: The broken links and the timeouts
        env:
          EVENT: ${{ github.event_name }}
        run: |
          errors=$(grep -E '^\| .*Errors' lychee/out.md | grep -oE '[0-9]+' | head -1)
          timeouts=$(grep -E '^\| .*Timeouts' lychee/out.md | grep -oE '[0-9]+' | head -1)
          echo "errors: ${errors:-none found}, timeouts: ${timeouts:-none found}"
          if [ -z "$errors" ] || [ -z "$timeouts" ]; then echo "::error::lychee/out.md has no summary table"; exit 1; fi
          if [ "$errors" -gt 0 ]; then echo "::error::$errors broken links"; exit 1; fi
          if [ "$timeouts" -gt 0 ]; then
            if [ "$EVENT" = "schedule" ]; then echo "::error::$timeouts links timed out"; exit 1; fi
            echo "::warning::$timeouts links timed out. This fails only the scheduled run."
          fi
