# Throwaway measure of a draft pull request: the compile cost of the branch against its base, and the walk alone.
# Head f04170b, tree 4e3c1af.
name: keyscope cost
on:
  push:
    branches: [keyscope-cost]
    paths: [.github/workflows/keyscope-cost.yml]
permissions: {}
concurrency:
  group: keyscope-cost
  cancel-in-progress: true
jobs:
  cost:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - name: Both tree hashes
        run: |
          echo "TREE side $(git rev-parse HEAD) $(git rev-parse HEAD:packages/compiler/src)"
          echo "TREE keyscope $(git rev-parse origin/keyscope) $(git rev-parse origin/keyscope:packages/compiler/src)"
          test "$(git rev-parse HEAD:packages/compiler/src)" = "$(git rev-parse origin/keyscope:packages/compiler/src)"
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The base
        run: |
          base=$(git merge-base HEAD origin/main)
          echo "BASE $base"
          git worktree add -q ../base "$base"
          cd ../base
          pnpm install --frozen-lockfile --filter @vex/pilots...
          cp "$GITHUB_WORKSPACE/tools/keyscope/cost-child.mjs" packages/pilots/scripts/cost-child.mjs
      # The cells of the table hold programs over the limit, so the branch lifts the limit. The check of the limit stays in the compile.
      - name: Measure
        run: |
          sed -i 's/MAX_PLACES: number = .*/MAX_PLACES: number = 2 ** 60;/' packages/compiler/src/unshared.ts
          grep -q 'MAX_PLACES: number = 2 \*\* 60;' packages/compiler/src/unshared.ts
          cp tools/keyscope/cost-child.mjs packages/pilots/scripts/cost-child.mjs
          node tools/keyscope/cost.mjs "$PWD/packages/pilots/scripts/cost-child.mjs" "$(dirname "$PWD")/base/packages/pilots/scripts/cost-child.mjs" "$RUNNER_TEMP/cost.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: keyscope-cost
          path: ${{ runner.temp }}/cost.jsonl
