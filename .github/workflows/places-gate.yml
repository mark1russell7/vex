# The gate of the limit of the places (COMPILE.PLACES). The limit has a rule: the largest doubling program of each shape
# under the limit stays under half of a heap of 2,048 MB, and a program of 4 times its places does not. Memory runs in
# CI, not on a shared machine.
name: Places gate

on:
  # Each pull request starts this workflow. The job changes skips the work when no file of the compile changes.
  pull_request:
  workflow_dispatch:

permissions: {}

# One run for each branch: a newer run stops the older one.
concurrency:
  group: places-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@d20d75b11120af71eaf6d2f59385c9cd053fff8b # main
        with:
          paths: |
            packages/core/src/**
            packages/compiler/src/**
            packages/compiler/bench/places.ts
            packages/compiler/test/places.ts
            .github/workflows/places-gate.yml
            !packages/*/src/**/*.test.ts
            !packages/*/src/__golden__/**

  rows:
    needs: changes
    if: needs.changes.outputs.match == 'true' || github.event_name == 'workflow_dispatch'
    name: Rows of the limit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The shell bash sets pipefail, so a gate that fails fails its step, also with its output piped into tee.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile
      # The gate checks the rows against the limit, so it reads the limit before the next step removes it.
      - id: limit
        run: echo "places=$(node packages/compiler/bench/places.ts limit)" >> "$GITHUB_OUTPUT"
      # The rows over the limit reach the compile only with no limit. The grep fails if the edit finds no line.
      - run: |
          sed -i 's/MAX_PLACES: number = .*/MAX_PLACES: number = 2 ** 60;/' packages/compiler/src/unshared.ts
          grep -q 'MAX_PLACES: number = 2 \*\* 60;' packages/compiler/src/unshared.ts
      - run: node packages/compiler/bench/places.ts rows "${{ steps.limit.outputs.places }}" 2>&1 | tee rows.txt
      # The flip of the gate (rule 8i). With more memory than the line in each child, the gate must fail on the measure.
      - run: |
          if PLACES_FAULT=1 node packages/compiler/bench/places.ts rows "${{ steps.limit.outputs.places }}" > fault.txt 2>&1; then
            echo "The gate passed with the fault."
            exit 1
          fi
          grep -E "^FAIL .* goes over " fault.txt
      - if: ${{ !cancelled() }}
        run: |
          {
            echo "### The rows of the limit of the places (peak memory of each process)"
            echo
            echo '```'
            grep -E "^(row|worst|FAIL)" rows.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
