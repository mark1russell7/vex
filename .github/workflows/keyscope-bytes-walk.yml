# Throwaway measure for the 0.18.0 report: the step of main that changes the bytes of each module of ireko, from the tag
# of 0.17.2 to the head of the branch. The tables and the core stay at this head, and only packages/compiler/src moves.
# Step list: each merge of main that touches the printer, and then each commit of the branch that touches it.
name: keyscope bytes walk
on:
  push:
    branches: [keyscope-cost]
    paths: [.github/workflows/keyscope-bytes-walk.yml]
permissions: {}
concurrency:
  group: keyscope-bytes-walk
  cancel-in-progress: true
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - name: Tree hashes
        run: |
          echo "TREE side $(git rev-parse HEAD) $(git rev-parse HEAD:packages/compiler/src)"
          echo "TREE keyscope $(git rev-parse origin/keyscope) $(git rev-parse origin/keyscope:packages/compiler/src)"
          test "$(git rev-parse HEAD:packages/compiler/src)" = "$(git rev-parse origin/keyscope:packages/compiler/src)"
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: Walk
        working-directory: packages/pilots
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TAG: "@mark1russell7/vex-compiler@0.17.2"
          BASE: 8ae233be3bd54744ae558020e5584975b4dfefee
        run: |
          cp ../../tools/keyscope/bytes.test.ts.txt src/zz-bytes.test.ts
          # An older printer does not have the hooks of the setup of the tests.
          sed -i 's#, "../compiler/test/module-fault.setup.ts"##' vitest.config.ts
          if grep -q module-fault vitest.config.ts; then exit 1; fi
          steps="$(git rev-parse --short "$TAG") $(git log --first-parent --reverse --format=%h "$TAG..$BASE" -- ../compiler/src | tr '\n' ' ') $(git log --first-parent --reverse --format=%h "$BASE..origin/keyscope" -- ../compiler/src | tr '\n' ' ')"
          echo "STEPS $(echo "$steps" | wc -w)"
          norows=0
          last=""
          for c in $steps; do
            git checkout -q "$c" -- ../compiler/src
            echo "STEP $c $(git log -1 --format=%s "$c" | cut -c1-90)"
            out="$RUNNER_TEMP/$c.txt"
            BYTES_LABEL=$c timeout 240 pnpm exec vitest run src/zz-bytes.test.ts --maxWorkers=1 > "$out" 2>&1 || true
            rows=$(grep -c "BYTES $c " "$out") || rows=0
            if [ "$rows" = 0 ]; then norows=$((norows + 1)); echo "NOROWS $c"; grep -E "Error" "$out" | head -2 | cut -c1-140; else grep -E "BYTES $c " "$out" | cut -c1-140; fi
            last="$rows"
          done
          echo "NOROWS_TOTAL $norows"
          # The tag and the head must give rows. A step in between can stop, and it is a stated stop.
          [ "$last" = 32 ]
          git checkout -q HEAD -- ../compiler/src
