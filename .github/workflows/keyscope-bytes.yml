# Throwaway measure of a draft pull request: the bytes of the sixteen ireko modules on each printer.
# Head 91f30f4, tree 5184b0e. Each arm measures, and an arm with no rows fails the job.
name: keyscope bytes
on:
  push:
    branches: [keyscope-cost]
    paths: [.github/workflows/keyscope-bytes.yml]
permissions: {}
concurrency:
  group: keyscope-bytes
  cancel-in-progress: true
jobs:
  bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - name: Both tree hashes
        run: |
          echo "TREE side $(git rev-parse HEAD) $(git rev-parse HEAD:packages/compiler/src)"
          echo "TREE keyscope $(git rev-parse origin/keyscope) $(git rev-parse origin/keyscope:packages/compiler/src)"
          test "$(git rev-parse HEAD:packages/compiler/src)" = "$(git rev-parse origin/keyscope:packages/compiler/src)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mark1russell7/ireko
          path: ireko-main
          persist-credentials: false
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: Measure
        working-directory: packages/pilots
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cp ../../tools/keyscope/bytes.test.ts.txt src/zz-bytes.test.ts
          cp ../../tools/keyscope/places.test.ts.txt src/zz-places.test.ts
          # The pin and the tag can stop at a form that they do not print. Each arm must give rows, and an arm of "all" must give the 32 rows.
          measure() {
            out="$RUNNER_TEMP/$1.txt"
            if BYTES_LABEL=$1 pnpm exec vitest run src/zz-bytes.test.ts --maxWorkers=1 > "$out" 2>&1; then state=passed; else state=failed; fi
            grep -E "^BYTES|FAIL|Tests |Error" "$out" || echo "NO LINES $1"
            rows=$(grep -c "^BYTES " "$out") || rows=0
            echo "LABEL $1 $state rows=$rows"
            [ "$rows" -gt 0 ]
            [ "$2" != all ] || [ "$rows" = 32 ]
          }
          pnpm exec vitest run src/zz-places.test.ts --maxWorkers=1 > "$RUNNER_TEMP/places.txt" 2>&1
          grep -E "PLACES|FAIL" "$RUNNER_TEMP/places.txt"
          measure branch all
          echo "COMMITTED start"
          if node scripts/module-bytes.ts ../../ireko-main > "$RUNNER_TEMP/committed.txt" 2>&1; then echo "COMMITTED equal"; else echo "COMMITTED differ"; fi
          tail -30 "$RUNNER_TEMP/committed.txt"
          # The setup of the tests calls hooks that an older printer does not have, so each arm from here runs with no setup of the compiler.
          sed -i 's#, "../compiler/test/module-fault.setup.ts"##' vitest.config.ts
          if grep -q module-fault vitest.config.ts; then exit 1; fi
          measure plain all
          git checkout "$(git merge-base HEAD origin/main)" -- ../compiler/src
          measure base all
          git checkout 3a0019f -- ../compiler/src
          measure old all
          git checkout ead65a70bde9f31b9fef4a8cc35cb69289167298 -- ../compiler/src
          measure pin
          git checkout "@mark1russell7/vex-compiler@0.17.2" -- ../compiler/src
          measure npm
