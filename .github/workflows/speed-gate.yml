# The two speed gates on a pull request that changes the code they measure: Vex against the hand-written loops
# (packages/core/bench/gate.ts) and the generated code against the same loops (packages/compiler/bench/gate.ts).
# Timing runs in CI, not on a shared machine. The nightly runs the same gates each day.
name: Speed gate

on:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  # Each week the job modules reads main once, with its catch. That read adds to the count of each model and to the
  # record of the version of Node.js on each read. The other gates do not start: the nightly measures main each day.
  schedule:
    - cron: "58 5 * * 3"
  workflow_dispatch:
    inputs:
      reps:
        description: The number of runs on separate runners, for the derivation of the limits (at most 3 at one time)
        type: choice
        options: ["1", "5"]
        default: "1"
      ablate:
        description: With true, the gate of the compiler also measures the ablation variants of the nested radial case (RADIALGAP)
        type: boolean
        default: false
      limit_walk:
        description: With true, the gate of the compiler also measures the walk of a data limit against a count at each key (LIMITCOST, the cases 6 and 7 without ablate)
        type: boolean
        default: false
      case:
        description: The cases of the compiler gate, from 0, separated by commas (5 is shapes). With a case, the core gate does not run. Empty runs all
        type: string
        default: ""
      node_flags:
        description: More flags of Node.js for each process of the compiler gate, for example --max-semi-space-size=64
        type: string
        default: ""
      gc:
        description: With true, each process of the compiler gate counts the garbage collections of each arm (GATEGC)
        type: boolean
        default: false

permissions: {}

# One run for each branch and settings: a newer run stops the older one. Each job holds at most 3 runner slots.
# The settings of a dispatch are in the group, so two dispatches with different settings run one after the other.
concurrency:
  group: speed-gate-${{ github.ref }}-${{ inputs.case }}-${{ inputs.node_flags }}-${{ inputs.gc }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # The gates start for a change of their code, or for a change of `pnpm-lock.yaml` that changes a package from
    # npm that they import (`GATE_NPM_PACKAGES` in `packages/testkit/src/gate-inputs.ts`).
    outputs:
      match: ${{ steps.changes.outputs.match == 'true' || steps.inputs.outputs.same == 'false' }}
      module_gate: ${{ steps.module_gate.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          # The gates measure the source, never a test, so a pull request that changes only tests skips them. The
          # bench uses `test-support.ts`, so it stays in. The nightly measures main each day.
          paths: |
            packages/core/src/**
            packages/core/bench/**
            packages/compiler/src/**
            packages/compiler/bench/**
            packages/compiler/test/growth.ts
            packages/domains/src/**
            packages/pilots/src/ireko-*.ts
            packages/pilots/bench/module-cost*.ts
            .github/workflows/speed-gate.yml
            !packages/*/src/**/*.test.ts
            !packages/*/src/__golden__/**
      # The catch of the job modules reads on a pull request that changes the files of that gate.
      - id: module_gate
        uses: mark1russell7/template/.github/actions/changes@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          paths: |
            packages/core/bench/measure.ts
            packages/pilots/bench/module-cost*.ts
            .github/workflows/speed-gate.yml
      - id: lock
        uses: mark1russell7/template/.github/actions/changes@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          paths: pnpm-lock.yaml
      # Only the lock file changed: the gates start only when a package of the gates has a new version or integrity.
      - if: steps.changes.outputs.match != 'true' && steps.lock.outputs.match == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: steps.changes.outputs.match != 'true' && steps.lock.outputs.match == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - if: steps.changes.outputs.match != 'true' && steps.lock.outputs.match == 'true'
        run: node scripts/workflow-gate.ts
      - id: inputs
        if: steps.changes.outputs.match != 'true' && steps.lock.outputs.match == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE:pnpm-lock.yaml" > "$RUNNER_TEMP/base-lock.yaml"
          node scripts/gate-inputs.ts "$RUNNER_TEMP/base-lock.yaml" pnpm-lock.yaml >> "$GITHUB_OUTPUT"

  gates:
    needs: changes
    if: needs.changes.outputs.match == 'true' && github.event_name != 'schedule'
    name: Speed gates ${{ matrix.rep }}
    runs-on: ubuntu-latest
    # Each limit comes from at least 5 runs: the worst value times 1.1 (the fleet rule of 2026-10-30).
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rep: ${{ fromJSON(inputs.reps == '5' && '[1, 2, 3, 4, 5]' || '[1]') }}
    timeout-minutes: 15
    permissions:
      contents: read
    # The shell bash sets pipefail, so a gate that fails fails its step, also with its output piped into tee.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile
      # A dispatch with the input case measures only these cases of the compiler gate, so the core gate does not run.
      - if: ${{ !inputs.case }}
        run: pnpm --filter @mark1russell7/vex run bench:gate | tee gates.txt
      # The gate of the compiler runs also when the first gate fails, and the summary keeps the lines of both.
      # A pull request has no inputs, so each of these settings is empty or 0, and the gate runs as before.
      - if: ${{ !cancelled() }}
        env:
          GATE_ABLATE: ${{ inputs.ablate && '1' || '0' }}
          GATE_LIMIT_WALK: ${{ inputs.limit_walk && '1' || '0' }}
          GATE_CASE: ${{ inputs.case }}
          GATE_NODE_FLAGS: ${{ inputs.node_flags }}
          GATE_GC: ${{ inputs.gc && '1' || '0' }}
        run: pnpm --filter @mark1russell7/vex-compiler run bench:gate | tee -a gates.txt
      # The gate of the growth reads exponents, so it has no limit for each CPU model (COMPILE.GROWTH).
      - if: ${{ !cancelled() && !inputs.case }}
        run: pnpm --filter @mark1russell7/vex-compiler run bench:growth | tee -a gates.txt
      - if: ${{ !cancelled() }}
        run: |
          {
            echo "### Speed gates (time ratios: lower is better)"
            echo
            echo '```'
            grep -E "^(runner|flags|ok|FAIL|gc|no read)" gates.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The time of a print of each module of ireko against a fixed base (COMPILE.MODULE.COST). The base is the commit that
  # the limits were read against. A fixed base also finds a cost that grows over many pull requests.
  modules:
    needs: changes
    if: (needs.changes.outputs.match == 'true' || github.event_name == 'schedule') && !inputs.case
    name: Module cost ${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rep: ${{ fromJSON(inputs.reps == '5' && '[1, 2, 3, 4, 5]' || '[1]') }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      BASE: 8ae233be3bd54744ae558020e5584975b4dfefee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The base
        run: |
          git worktree add -q ../base "$BASE"
          cp packages/pilots/bench/module-cost-child.ts ../base/packages/pilots/bench/
          cd ../base
          pnpm install --frozen-lockfile --filter @vex/pilots...
      - run: pnpm --filter @vex/pilots run module-cost "$(dirname "$PWD")/base" --turn "$((REP - 1))" --record "$PWD/module-cost.jsonl" | tee module-cost.txt
        env:
          REP: ${{ matrix.rep }}
      # This step holds the median clause of the rule. It does not hold the second pair clause: a cost in each round moves
      # the median first. A pull request reads it only with a change of the gate, because a miss by noise must not block
      # each pull request. A dispatch and the weekly run read it in each rep. At an added 15 %, 20 of 20 reads failed each
      # module, and the smallest margin at these limits is 0.015. This step adds 20 %: docs/COMPILER.md has that count.
      - name: The gate fails a known cost
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.module_gate == 'true') }}
        run: pnpm --filter @vex/pilots run module-cost "$(dirname "$PWD")/base" --catch --record "$PWD/module-cost.jsonl" | tee -a module-cost.txt
      # This step holds the second pair clause. The cost goes in 2 rounds of 7, so the median stays under its limit and the
      # clause must fail alone (rule 8i). The read of the gate above is the clean copy of this job.
      - name: The gate fails a cost in 2 rounds
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.module_gate == 'true') }}
        run: pnpm --filter @vex/pilots run module-cost "$(dirname "$PWD")/base" --rounds --record "$PWD/module-cost.jsonl" | tee -a module-cost.txt
      - if: ${{ !cancelled() }}
        run: |
          {
            echo "### The time of a print of each module (ratios against $BASE: lower is better)"
            echo
            echo '```'
            grep -E "^(runner|order|ok|FAIL|undecided|UNDECIDED|false-fail|gain|no read|(catch|rounds) (order|ok|FAIL|fault|undecided|UNDECIDED))" module-cost.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The reads of each model add up over weeks, so the record stays for the longest time that the repository gives.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-cost-${{ matrix.rep }}
          path: |
            module-cost.txt
            module-cost.jsonl
          retention-days: 90

  speed-gate-ok:
    name: Speed gate OK
    if: ${{ !cancelled() }}
    needs: [changes, gates, modules]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          needs: ${{ toJSON(needs) }}
          # On the weekly schedule only the job modules runs (see "on:"), so the job gates is skipped by design.
          # On each other event a skipped job gates fails the summary.
          allow-skip: ${{ github.event_name == 'schedule' && 'gates' || '' }}
