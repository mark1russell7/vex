# A diagnostic of V-089 for one branch. This file is not for main.
name: V-089 diagnostic

on:
  push:
    branches: [v089-diag]

permissions: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/compiler/bench/v089-diag.ts 2>&1 | tee diag.txt
      - if: ${{ !cancelled() }}
        run: |
          {
            echo '```'
            grep -E "^diag" diag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
