# The two speed gates on a pull request that changes the code they measure: Vex against the hand-written loops
# (packages/core/bench/gate.ts) and the generated code against the same loops (packages/compiler/bench/gate.ts).
# Timing runs in CI, not on a shared machine. The nightly runs the same gates each day.
name: Speed gate

on:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  workflow_dispatch:
    inputs:
      reps:
        description: The number of runs on separate runners, for the derivation of the limits (at most 3 at one time)
        type: choice
        options: ["1", "5"]
        default: "1"
      modes:
        description: A part of the title of a compiler case. The job then runs bench/modes.ts for that case in fresh processes, not the gates (GATENOISE).
        type: string
        default: ""

permissions: {}

# One run for each branch: a newer run stops the older one. The workflow holds at most 3 runner slots.
concurrency:
  group: speed-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@f05c6eeb35e33a040bdfdcd7d07a1d2c00640f8d # main
        with:
          paths: |
            packages/core/src/**
            packages/core/bench/**
            packages/compiler/src/**
            packages/compiler/bench/**
            packages/pilots/src/ireko-*.ts
            .github/workflows/speed-gate.yml

  gates:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    name: Speed gates ${{ matrix.rep }}
    runs-on: ubuntu-latest
    # Each limit comes from at least 5 runs: the worst value times 1.1 (the fleet rule of 2026-10-30).
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        rep: ${{ fromJSON(inputs.reps == '5' && '[1, 2, 3, 4, 5]' || '[1]') }}
    timeout-minutes: ${{ inputs.modes && 30 || 15 }}
    permissions:
      contents: read
    # The shell bash sets pipefail, so a gate that fails fails its step, also with its output piped into tee.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With the input modes, the job examines one compiler case in fresh processes (bench/modes.ts) and runs no gate.
      - if: ${{ inputs.modes != '' && inputs.modes != null }}
        env:
          CASE: ${{ inputs.modes }}
        run: |
          node packages/compiler/bench/modes.ts "$CASE" 40 | tee modes.txt
          {
            echo "### The modes of one case (time ratios: lower is better)"
            echo
            echo '```'
            grep -E "^(runner|summary)" modes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ (inputs.modes == '' || inputs.modes == null) }}
        run: pnpm --filter @mark1russell7/vex run bench:gate | tee gates.txt
      # The gate of the compiler runs also when the first gate fails, and the summary keeps the lines of both.
      - if: ${{ !cancelled() && (inputs.modes == '' || inputs.modes == null) }}
        run: pnpm --filter @mark1russell7/vex-compiler run bench:gate | tee -a gates.txt
      - if: ${{ !cancelled() && (inputs.modes == '' || inputs.modes == null) }}
        run: |
          {
            echo "### Speed gates (time ratios: lower is better)"
            echo
            echo '```'
            grep -E "^(runner|ok|FAIL)" gates.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  speed-gate-ok:
    name: Speed gate OK
    if: always()
    needs: [changes, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@f05c6eeb35e33a040bdfdcd7d07a1d2c00640f8d # main
        with:
          needs: ${{ toJSON(needs) }}
