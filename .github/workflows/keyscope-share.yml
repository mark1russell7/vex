# Throwaway measure of a draft pull request: the share of generated programs that reach the bad state of V-077 (on the printer of the branch).
# Head 91f30f4, tree 5184b0e.
name: keyscope share
on:
  push:
    branches: [keyscope-cost]
    paths: [.github/workflows/keyscope-share.yml]
permissions: {}
concurrency:
  group: keyscope-share
  cancel-in-progress: true
jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    strategy:
      fail-fast: false
      matrix:
        arb: ["measure program.num", "measure withFns"]
        depth: ["4", "6"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - name: Both tree hashes
        run: |
          echo "TREE side $(git rev-parse HEAD) $(git rev-parse HEAD:packages/compiler/src)"
          echo "TREE keyscope $(git rev-parse origin/keyscope) $(git rev-parse origin/keyscope:packages/compiler/src)"
          test "$(git rev-parse HEAD:packages/compiler/src)" = "$(git rev-parse origin/keyscope:packages/compiler/src)"
      - run: pnpm install --frozen-lockfile --filter @mark1russell7/vex-compiler...
      # This step writes a line each 15 seconds: the memory in use and the largest process. A later step prints the file.
      - name: Record the memory
        run: |
          nohup bash -c 'while sleep 15; do echo "MEM $(date -u +%H:%M:%S) used=$(free -m | awk "NR==2{print \$3}") largest=$(ps -eo rss= | sort -n | tail -1 | awk "{print int(\$1/1024)}")"; done' > "$RUNNER_TEMP/mem.log" 2>&1 &
      # The earlier job of this name ran 49 minutes and left no log, and its siblings took 4 to 11 minutes.
      # The step timeout and the heap limit stop the job while the runner lives, so a repeat leaves a reading.
      - name: Measure
        timeout-minutes: 30
        working-directory: packages/compiler
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          SCRATCH_OUT: ${{ runner.temp }}/share.jsonl
          SCRATCH_N: "500000"
          SCRATCH_SEED: "20261104"
          SCRATCH_DEPTH: ${{ matrix.depth }}
          FC_SEED: "20261104"
          MATRIX_ARB: ${{ matrix.arb }}
        run: |
          cp ../../tools/keyscope/namegap-scratch.test.ts.txt src/namegap-scratch.test.ts
          node ../../tools/keyscope/instrument.mjs src/module.ts src/module-scratch.ts
          pnpm exec vitest run src/namegap-scratch.test.ts --maxWorkers=1 -t "$MATRIX_ARB"
          echo "SHARE $(cat "$SCRATCH_OUT")"
          cat "$SCRATCH_OUT.examples" || true
      - name: The memory of the job
        if: ${{ always() }}
        run: |
          echo "PEAK used=$(sed -E 's/.*used=([0-9]+).*/\1/' "$RUNNER_TEMP/mem.log" | sort -n | tail -1) largest=$(sed -E 's/.*largest=([0-9]+).*/\1/' "$RUNNER_TEMP/mem.log" | sort -n | tail -1) lines=$(wc -l < "$RUNNER_TEMP/mem.log")"
          tail -8 "$RUNNER_TEMP/mem.log"
