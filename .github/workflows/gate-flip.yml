# A read branch: the spread of the depth of the source at one commit. This branch does not merge.
name: Gate flip

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: gate-flip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  depth:
    name: The spread of the depth, read ${{ matrix.read }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        read: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile
      - run: grep -m1 'model name' /proc/cpuinfo
      - run: node packages/compiler/bench/growth.ts depth 2>/dev/null
