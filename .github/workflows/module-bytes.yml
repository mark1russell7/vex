# The gate of the committed modules (COMPILE.MODULE.BYTES). A repository that commits a printed module calls this
# workflow with a commit of vex. The workflow prints each module from that commit and compares the bytes.
name: Module bytes

on:
  workflow_call:
    inputs:
      vex-ref:
        description: The commit of vex that printed the committed modules.
        required: true
        type: string

permissions: {}

jobs:
  bytes:
    name: Module bytes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mark1russell7/vex
          ref: ${{ inputs.vex-ref }}
          path: vex
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: vex/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
        working-directory: vex
      - name: Compare the bytes, and read the age of the pin
        working-directory: vex
        run: node packages/pilots/scripts/module-bytes.ts ../caller --published "$(npm view @mark1russell7/vex-compiler versions --json)"
