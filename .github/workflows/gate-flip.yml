# A read branch: two paired reads of the time of a print of each module, each with its base in the same job. This file does not merge.
name: Gate flip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair:
    name: Pair ${{ matrix.name }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { name: cut, rep: 1, tree: 0b6811e916efddc45350e03a521528592b990a2a, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: v089, rep: 1, tree: ec40c2b986d0f8cb15d70b54e2781946aac3e62b, base: cde8b8ff35a81bca9aca35ce4b385f7dcdb9920e }
          - { name: cut, rep: 2, tree: 0b6811e916efddc45350e03a521528592b990a2a, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: v089, rep: 2, tree: ec40c2b986d0f8cb15d70b54e2781946aac3e62b, base: cde8b8ff35a81bca9aca35ce4b385f7dcdb9920e }
          - { name: cut, rep: 3, tree: 0b6811e916efddc45350e03a521528592b990a2a, base: ec40c2b986d0f8cb15d70b54e2781946aac3e62b }
          - { name: v089, rep: 3, tree: ec40c2b986d0f8cb15d70b54e2781946aac3e62b, base: cde8b8ff35a81bca9aca35ce4b385f7dcdb9920e }
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      BASE: ${{ matrix.base }}
      REP: ${{ matrix.rep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ matrix.tree }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The base
        run: |
          git worktree add -q ../base "$BASE"
          cp packages/pilots/bench/module-cost-child.ts ../base/packages/pilots/bench/
          cd ../base
          pnpm install --frozen-lockfile --filter @vex/pilots...
      - run: pnpm --filter @vex/pilots run module-cost "$(dirname "$PWD")/base" --turn "$((REP - 1))"
