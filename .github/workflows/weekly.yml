name: Weekly

# The long run of phase D (docs/QUALITY-PLAN.md §8): at most one million runs of each property, each week. Each package
# has its own job, so a slow package does not stop the others. The setup prints the seed. To repeat a failure, set FC_SEED.
# Each property has a time budget of 10 minutes (FC_TIME_LIMIT_MS), inside the test time-out of 15 minutes. A property
# that reaches the budget stops without a failure, and the log gives its number of runs. Before the budget, the slow
# properties hit the time-out, so the run was red with no counterexample (2026-10-18 to 2026-11-01).
on:
  schedule:
    # Each scheduled heavy run of the fleet has its own minute (docs/STRATEGY.md of the fleet, 2026-10-30).
    - cron: "53 4 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  properties:
    name: properties (1000000 runs) ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # At most 3 jobs of the matrix at one time, so the gates and the releases of the fleet keep their slots.
      max-parallel: 3
      matrix:
        package: ["@mark1russell7/vex-testkit", "@mark1russell7/vex-compiler", "@vex/pilots", "@vex/formula", "@vex/sheet-app", "@vex/site"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ matrix.package }}" run test
        env:
          FC_NUM_RUNS: "1000000"
          FC_TIME_LIMIT_MS: "600000"
