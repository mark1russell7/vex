# One part of the mutation lane: the steps that the nightly job and the weekly job share (tools/mutation/README.md).
name: Mutation part
description: This action starts Stryker on one part of the lane, and it keeps the report as an artifact.

inputs:
  part:
    description: The part of the lane.
    required: true
  changed:
    description: The paths of the lane that this part reads, with commas. Empty reads each file of the part.
    required: false
    default: ""
  timeout-ms:
    description: The added clock limit of one mutant in milliseconds. Empty keeps the default of the lane.
    required: false
    default: ""
  dry-run:
    description: The value 1 stops Stryker after its first test run, so the part gives no score.
    required: false
    default: ""
  stop-minutes:
    description: The minutes after which the part stops itself, under the limit of its job, so that the costs reach the artifact. Empty never stops it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Stryker with Vitest 4.1, in tools/mutation, until Stryker supports Vitest 5
    # The number of the disabled mutants of each file. A new disable must also go into tools/mutation/disables.json.
    - name: The disabled mutants
      shell: bash
      run: node tools/mutation/disables.mjs | tee -a "$GITHUB_STEP_SUMMARY"
    # A job that reaches its limit skips each step after it, the upload too. So the part stops itself first, and it fails
    # with the costs of the mutants that ended (tools/mutation/lane-cost.ts, LANE.COST).
    - run: |
        if [[ -n "$STOP_MINUTES" && ! "$STOP_MINUTES" =~ ^[0-9]+$ ]]; then echo "The minutes '$STOP_MINUTES' are not a whole number." >&2; exit 1; fi
        if [[ -z "$STOP_MINUTES" ]]; then exec pnpm --filter @vex/mutation run mutation; fi
        status=0
        timeout --signal=TERM --kill-after=2m "${STOP_MINUTES}m" pnpm --filter @vex/mutation run mutation || status=$?
        if [[ $status -eq 124 || $status -eq 137 ]]; then
          echo "The part $VEX_MUTATE reached its stop of $STOP_MINUTES minutes, so it gives no score. The artifact keeps the cost of each mutant that ended." | tee -a "$GITHUB_STEP_SUMMARY" >&2
        fi
        exit $status
      shell: bash
      env:
        STOP_MINUTES: ${{ inputs.stop-minutes }}
        VEX_MUTATE: ${{ inputs.part }}
        VEX_CHANGED: ${{ inputs.changed }}
        VEX_TIMEOUT_MS: ${{ inputs.timeout-ms }}
        VEX_DRY_RUN: ${{ inputs.dry-run }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: mutation-report-${{ inputs.part }}
        path: reports/mutation/
        if-no-files-found: ignore
