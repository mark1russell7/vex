# A read branch: a paired read of the time of a print of each module for V-093, with its base in the same job. This file does not merge.
name: Gate flip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair:
    name: Pair ${{ matrix.name }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { name: fix, rep: 1, tree: ce0e3980d756a6e2bb253e6ff03afa22e1e3ea17, base: 22c9a24258bea69dbc7e19f277fe334e14e6a6e1 }
          - { name: fix, rep: 2, tree: ce0e3980d756a6e2bb253e6ff03afa22e1e3ea17, base: 22c9a24258bea69dbc7e19f277fe334e14e6a6e1 }
          - { name: fix, rep: 3, tree: ce0e3980d756a6e2bb253e6ff03afa22e1e3ea17, base: 22c9a24258bea69dbc7e19f277fe334e14e6a6e1 }
          - { name: latefix, rep: 1, tree: cdf123e705830434921eec98b3b6077896ebbd55, base: 22c9a24258bea69dbc7e19f277fe334e14e6a6e1 }
          - { name: latefix, rep: 2, tree: cdf123e705830434921eec98b3b6077896ebbd55, base: 22c9a24258bea69dbc7e19f277fe334e14e6a6e1 }
          - { name: latefix, rep: 3, tree: cdf123e705830434921eec98b3b6077896ebbd55, base: 22c9a24258bea69dbc7e19f277fe334e14e6a6e1 }
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      BASE: ${{ matrix.base }}
      REP: ${{ matrix.rep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ matrix.tree }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: The base
        run: |
          git worktree add -q ../base "$BASE"
          cp packages/pilots/bench/module-cost-child.ts ../base/packages/pilots/bench/
          cd ../base
          pnpm install --frozen-lockfile --filter @vex/pilots...
      - run: pnpm --filter @vex/pilots run module-cost "$(dirname "$PWD")/base" --turn "$((REP - 1))"
