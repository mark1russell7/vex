# The CPU profile of one case of the speed gate of the compiler (packages/compiler/bench/profile.ts). Timing runs in
# CI, not on a shared machine. The summary gives the time of each arm and its top functions, and the artifact keeps
# each .cpuprofile for a viewer.
name: Profile

on:
  workflow_dispatch:
    inputs:
      case:
        description: The case of the compiler gate, from 0 (3 is the nested radial ring of 60 children)
        type: string
        default: "3"
      processes:
        description: The number of fresh processes, each with its own profile
        type: string
        default: "3"
      arms:
        description: The entry function of each arm, separated by commas
        type: string
        default: radial,radialArrange
      node_flags:
        description: More flags of Node.js for each process, for example --no-turbo-inlining
        type: string
        default: ""

permissions: {}

concurrency:
  group: profile-${{ github.ref }}-${{ inputs.case }}-${{ inputs.node_flags }}
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          GATE_CASE: ${{ inputs.case }}
          PROFILE_PROCESSES: ${{ inputs.processes }}
          PROFILE_ARMS: ${{ inputs.arms }}
          PROFILE_NODE_FLAGS: ${{ inputs.node_flags }}
          PROFILE_DIR: ${{ runner.temp }}/profiles
        run: node packages/compiler/bench/profile.ts | tee profile.txt
      - if: ${{ !cancelled() }}
        env:
          GATE_CASE: ${{ inputs.case }}
        run: |
          {
            echo "### CPU profile of case $GATE_CASE"
            echo
            echo '```'
            cat profile.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-case-${{ inputs.case }}
          path: ${{ runner.temp }}/profiles
          retention-days: 14
