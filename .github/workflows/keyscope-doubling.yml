# Throwaway measure of a draft pull request: compile time, bytes and memory of doubling programs with shared objects (second run).
name: keyscope doubling
on:
  push:
    branches: [keyscope]
    paths: [.github/workflows/keyscope-doubling.yml]
permissions: {}
jobs:
  doubling:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @vex/pilots...
      - name: Install the release
        run: npm install --prefix "$RUNNER_TEMP/old" --no-audit --no-fund @mark1russell7/vex-compiler@0.17.2 @mark1russell7/vex@0.17.2 @mark1russell7/vex-domains@0.17.2
      - name: The release
        run: |
          cp tools/keyscope/doubling-child.mjs "$RUNNER_TEMP/old/child.mjs"
          node tools/keyscope/doubling.mjs npm-0.17.2 "$RUNNER_TEMP/old/child.mjs"
      - name: The branch
        run: |
          cp tools/keyscope/doubling-child.mjs packages/pilots/scripts/doubling-child.mjs
          node tools/keyscope/doubling.mjs branch packages/pilots/scripts/doubling-child.mjs
