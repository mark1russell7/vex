# The name run: 20,000 draws of each property that puts printed modules through the name gate. The run of 200 draws in
# ci.yml did not find V-084 (draw 4664) and found V-085 by chance (draw 107). Seed 20261104 and seed 1084396609 are the
# seeds of these finds. The daily run takes a new seed from the date, and the record of each run holds its seed.
name: Name run

on:
  # Each pull request starts this workflow. The job changes skips the work when no file of the printer changes.
  pull_request:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: The seed of one run. Empty gives the seeds of the finds.
        type: string
        default: ""

permissions: {}

# One run for each branch: a newer run stops the older one.
concurrency:
  group: name-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@2cc4e3c80458e3f1650e10b8b097522afa34dbe1 # main
        with:
          paths: |
            packages/compiler/src/**
            packages/compiler/test/**
            packages/testkit/src/arbitraries.ts
            .github/workflows/name-run.yml
            scripts/name-run.ts
            !packages/*/src/__golden__/**

  seeds:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.match == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      seeds: ${{ steps.seeds.outputs.seeds }}
    steps:
      - id: seeds
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.seed }}
        run: |
          if [ -n "$INPUT" ]; then echo "seeds=[$INPUT]" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = schedule ]; then echo "seeds=[$(date -u +%Y%m%d)]" >> "$GITHUB_OUTPUT"
          else echo "seeds=[20261104,1084396609]" >> "$GITHUB_OUTPUT"; fi

  names:
    needs: seeds
    name: Names, seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: ${{ fromJSON(needs.seeds.outputs.seeds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile --filter @mark1russell7/vex-compiler...
      - name: The properties of the name gate
        working-directory: packages/compiler
        env:
          FC_SEED: ${{ matrix.seed }}
          FC_NUM_RUNS: "20000"
          FC_TIME_LIMIT_MS: "5400000"
          FC_RECORD_FILE: ${{ runner.temp }}/record.jsonl
        run: pnpm exec vitest run src/module.test.ts src/scope-key.test.ts --maxWorkers=1 --coverage.enabled=false -t "each depth uses the names|V-078 P17|V-080 P17|V-081 COMPILE.MODULE. a module of each mode"
      - name: The record of the run
        if: ${{ !cancelled() }}
        env:
          SEED: ${{ matrix.seed }}
        run: node scripts/name-run.ts "$RUNNER_TEMP/record.jsonl" "$SEED"
