# Throwaway measure of a draft pull request: long runs of the properties of the names, the key and the printed names.
name: keyscope names
on:
  push:
    branches: [keyscope-cost]
    paths: [.github/workflows/keyscope-names.yml]
permissions: {}
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @mark1russell7/vex-compiler...
      - name: Measure
        working-directory: packages/compiler
        env:
          FC_SEED: "20261104"
          FC_NUM_RUNS: "20000"
          FC_TIME_LIMIT_MS: "14400000"
          FC_RECORD_FILE: ${{ runner.temp }}/record.jsonl
        run: |
          pnpm exec vitest run src/module.test.ts src/scope-key.test.ts --maxWorkers=1 -t "each depth uses the names|V-078 P17|V-080 P17|V-081 COMPILE.MODULE: a module of each mode" || true
          echo "RECORD $(cat "$RUNNER_TEMP/record.jsonl")"
