name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks of each Node.js version: the shared CI of mark1russell7 (reusable-ci.yml of
  # mark1russell7/template, its CI.md)
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@787183c2d49e3bb10031457cb36fc4ae8975eeb2 # main
    permissions:
      contents: read
    with:
      # typecheck: the source and the tests of each package (tsconfig.json and tsconfig.test.json).
      # lint: Oxlint with type-aware rules.
      # test:coverage: the coverage of @mark1russell7/vex from the tests of each package, with the thresholds of vitest.config.ts.
      # test:docs: the code blocks of the docs with the meta word "doctest": types, values and type errors.
      # check:conventions: the rules of @mark1russell7/conventions, with the exceptions and their reasons in package.json.
      # lint:ste: the writing rules (ASD-STE100) of the README files, the docs and the doc comments.
      scripts: typecheck lint check:conventions test test:coverage test:docs lint:ste
      node-versions: '["22", "24", "26"]'

  # The site: typecheck of the widgets, the spec pages and the static build
  site:
    runs-on: ubuntu-latest
    # The site job runs Playwright in three browsers. It takes about 9 minutes, and more on a slow runner.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vex/site run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      # The shared action installs the browsers from a cache, with a time limit and a second try for each install.
      - uses: mark1russell7/template/.github/actions/setup-playwright@787183c2d49e3bb10031457cb36fc4ae8975eeb2 # main
        with:
          browsers: chromium firefox webkit
          command: pnpm --filter @vex/site exec playwright
      # The smoke tests: each route renders without a console error, and the main widgets work
      - run: pnpm --filter @vex/site run test:e2e
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

  # The packages as npm gives them: the build, publint and attw on each tarball, and a program in an empty project
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:packages

  # The only check that a pull request must pass
  ci-ok:
    name: CI OK
    if: always()
    needs: [ci, site, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass (template #85).
          ALLOW_SKIP: ""
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
