name: Weekly

# The long run of phase D (docs/QUALITY-PLAN.md §8): at most one million runs of each property, each week. Each package
# has its own job, so a slow package does not stop the others. The setup prints the seed. To repeat a failure, dispatch with the inputs seed and file.
# Each property has a time budget of 10 minutes (FC_TIME_LIMIT_MS), inside the test time-out of 15 minutes. Before the
# budget, the slow properties hit the time-out, so the run was red with no counterexample (2026-10-18 to 2026-11-01).
# A property that reaches the budget fails under its minimum of runs in spec/weekly-runs.json: from 5 green runs, the lower
# of the worst runs divided by 1.1 and the worst runs minus their spread. Each job uploads the runs of each property. A dispatch with reps 5 and record_only gives the records
# for scripts/weekly-minimums.ts.
on:
  schedule:
    # Each scheduled heavy run of the fleet has its own minute (docs/STRATEGY.md of the fleet, 2026-10-30).
    - cron: "12 4 * * 0"
  workflow_dispatch:
    inputs:
      reps:
        description: The number of runs of each package, for the derivation of the minimums (at most 3 jobs at one time)
        type: choice
        options: ["1", "5"]
        default: "1"
      record_only:
        description: Collect the records with no minimum of runs (a counterexample still fails)
        type: boolean
        default: false
      package:
        description: The one package to run, or all the packages
        type: choice
        options: ["all", "@mark1russell7/vex-testkit", "@mark1russell7/vex-compiler", "@vex/pilots", "@vex/formula", "@vex/sheet-app", "@vex/site"]
        default: "all"
      seed:
        description: The seed of fast-check for each test file (FC_SEED), to repeat a run. Empty gives a new seed to each file
        type: string
        default: ""
      file:
        description: The one test file of the package to run, for example src/module.test.ts. Empty runs each file
        type: string
        default: ""

permissions: {}

# The event name is in the key: a dispatch with other inputs never cancels or holds a scheduled run (fleet rule of 2026-11-02).
# Each input is also in the key. A group keeps one pending run, and a new pending run cancels it. With the event alone,
# the dispatch of a 5-rep record cancelled the pending repeat of one seed (run 42180256166, 2026-11-06).
concurrency:
  group: weekly-${{ github.event_name }}-${{ github.ref }}-${{ inputs.package }}-${{ inputs.reps }}-${{ inputs.record_only }}-${{ inputs.seed }}-${{ inputs.file }}
  cancel-in-progress: false

jobs:
  properties:
    name: properties (1000000 runs) ${{ matrix.package }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # At most 3 jobs of the matrix at one time, so the gates and the releases of the fleet keep their slots.
      max-parallel: 3
      matrix:
        # A scheduled run has no inputs, so it runs all the packages.
        package: ${{ fromJSON((inputs.package == '' || inputs.package == 'all' || inputs.package == null) && '["@mark1russell7/vex-testkit", "@mark1russell7/vex-compiler", "@vex/pilots", "@vex/formula", "@vex/sheet-app", "@vex/site"]' || format('["{0}"]', inputs.package)) }}
        rep: ${{ fromJSON(inputs.reps == '5' && '[1, 2, 3, 4, 5]' || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: node scripts/workflow-gate.ts
      - run: pnpm install --frozen-lockfile
      # The log has the heap after each test that ends. A test that loses its worker has no line.
      # The inputs go through the environment, not into the script. An empty FC_SEED is the seed 0, so the step sets
      # FC_SEED only for a seed of the input.
      - run: |
          if [[ -n "$SEED" && ! "$SEED" =~ ^[0-9]+$ ]]; then echo "The seed '$SEED' is not a whole number." >&2; exit 1; fi
          if [[ -n "$FILE" && ! "$FILE" =~ ^src/[A-Za-z0-9._/-]+\.test\.tsx?$ ]]; then echo "The file '$FILE' is not a test file under src." >&2; exit 1; fi
          if [[ -n "$SEED" ]]; then export FC_SEED="$SEED"; fi
          pnpm --filter "$PACKAGE" run test --logHeapUsage --reporter=verbose --reporter=github-actions ${FILE:+"$FILE"}
        shell: bash
        env:
          SEED: ${{ inputs.seed }}
          FILE: ${{ inputs.file }}
          PACKAGE: ${{ matrix.package }}
          FC_NUM_RUNS: "1000000"
          FC_TIME_LIMIT_MS: "600000"
          FC_MIN_RUNS_FILE: ${{ github.workspace }}/spec/weekly-runs.json
          FC_RECORD_FILE: ${{ runner.temp }}/runs-rep${{ matrix.rep }}.jsonl
          FC_RECORD_ONLY: ${{ inputs.record_only && '1' || '' }}
      # The summary keeps the failed properties apart from the properties with no minimum yet.
      - if: ${{ !cancelled() }}
        run: pnpm exec tsx scripts/weekly-summary.ts "$FC_RECORD_FILE" spec/weekly-runs.json >> "$GITHUB_STEP_SUMMARY"
        env:
          FC_RECORD_FILE: ${{ runner.temp }}/runs-rep${{ matrix.rep }}.jsonl
          FC_RECORD_ONLY: ${{ inputs.record_only && '1' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: weekly-runs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/runs-rep${{ matrix.rep }}.jsonl
          if-no-files-found: ignore
